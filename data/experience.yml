        conservation coalitions.
      priority: 2
      tags: [outreach, leadership]
    - text: >-
        Improved collaboration between the Earth Action program, ESDS, and
        the Office of the Chief Science Data Officer through co-sponsored
        events and shared solicitation language.
      priority: 3
      tags: [partnerships, open-science]
    - text: >-
        Technical expert on ecology and conservation for data calls from the
        White House Office of Science and Technology Policy.
      priority: 3
      tags: [policy, conservation]
    - text: >-
        Subject matter expert for natural resource sciences in the Open
