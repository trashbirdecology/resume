        Built the relationships behind a Memorandum of Understanding now in
        development among USGS, NASA, and the National Park Service, and a
        new center-to-center
        partnership between USGS Patuxent Wildlife Research Center and NASA
        Goddard.
      priority: 1
      tags: [interagency, partnerships]
      ecq: [5]
