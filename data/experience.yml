# THE RUNNING LIST. Every role, and everything I did in it.
#
# Add to this file whenever something happens; never delete (comment out
# instead). Resumes are filtered views of this file.
#
# Fields on each accomplishment:
#   text:      the bullet, written so it can stand alone
#   priority:  1 = headline (always in short resumes), 2 = strong, 3 = depth
#   tags:      topics, used by templates to filter (vocabulary in README)
#   ecq:       SES Executive Core Qualifications it supports (1-5), optional
#                1 Rule of Law & Principles of the American Founding
#                2 Driving Efficiency   3 Merit & Competence
#                4 Leading People       5 Achieving Results
#   verify:    a note when a fact still needs checking; templates skip
#              these unless you render with include_unverified = TRUE

- id: nasa-esds-pe
  title: Program Executive, Earth Science Data Systems (ESDS)
  org: NASA Headquarters
  unit: Earth Science Division, Science Mission Directorate
  location: Washington, DC
  start: 2024-11
  end: present
  series_grade: GS-0801-15
  hours: 40
  summary: >-
    Programmatic lead for NASA's operational Earth data production
    portfolio: Foundational Data Products (FDP), the Fire Information for
    Resource Management System (FIRMS), the Land, Atmosphere Near-real-time
    Capability for Earth Observations (LANCE), Science Investigator-led
    Processing Systems (SIPS), and the Earth Science Information Partners
    (ESIP) cooperative agreement. About $40M per year, executed by civil
    servant project teams and their contractors at four NASA centers.
  accomplishments:
    - text: >-
        Leading formulation of Foundational Data Products from concept to a
        leadership-approved framework (definition, designation criteria,
        product specifications, portfolio management); required every
        product to meet NASA Standard Data Product criteria.
      priority: 1
      tags: [strategy, governance, data-systems, leadership]
      ecq: [3, 5]
    - text: >-
        Consolidating existing data production work into an FDP budget more
        than 20% smaller than its current cost; set designation criteria
        that retire duplicative products and centralize processing in the
        cloud; reused NASA's Senior Review framework for FDP evaluation
        instead of building a new process.
      priority: 1
      tags: [efficiency, budget, data-systems, governance]
      ecq: [2]
    - text: >-
        Brought Headquarters accountability to two long-running near-real-time
        systems (LANCE and FIRMS) that had operated with minimal oversight:
        required their first formal project plans, made Earth Action a
        co-signatory, and required it to fund non-data-system work such as
        science and outreach, cutting ESDS's share of those costs by about
        half. Now extending the model to NASA Black Marble.
      priority: 1
      tags: [governance, efficiency, partnerships, leadership]
      ecq: [2, 4]
    - text: >-
        Over more than a year, moved Goddard's Earth Sciences Division (Code
        610) and the ESDIS Project (Code 423) from limited coordination to a
        working partnership on LANCE and FIRMS; the two organizations now
        place staff on each other's subproject leadership teams.
      priority: 1
      tags: [leadership, people, partnerships]
      ecq: [4]
    - text: >-
        Requested a capability to track dependencies among SIPS data
        products; the ESDIS Project grew it into a full knowledge graph and
        management system that now informs continuity risk management and
        FDP priorities.
      priority: 1
      tags: [data-systems, governance, metrics]
      ecq: [3]
    - text: >-
        Oversee and direct about 10 civil servants in center project offices,
        who in turn manage contractor teams: set priorities, review
        deliverables, and hold projects to cost and schedule. Selected the
        FDP Project Manager and negotiated the agreement standing up the new
        FDP project office at Goddard.
      priority: 1
      tags: [people, leadership, budget]
      ecq: [4]
    - text: >-
        Identified the AAAS Science & Technology Policy Fellowship as a new
        way to bring talent into ESDS, now in use; mentor and delegate
        portfolio workstreams to the incoming fellow; set stretch
        assignments for the program's operations officer; mentor 1-2 NASA
        interns each year.
      priority: 2
      tags: [people, mentoring, leadership]
      ecq: [4, 5]
    - text: >-
        Leading the use of data usage metrics across the ESDS portfolio,
        including private-sector use, to guide Earth Science Division
        investment priorities, center-level engagement, and which products
        FDP will designate.
      priority: 2
      tags: [metrics, strategy, private-sector]
      ecq: [3, 5]
    - text: >-
        First program executive to provide direct, consistent SIPS oversight;
        led ESDIS to institute quarterly check-ins with each SIPS.
      priority: 2
      tags: [governance, data-systems]
      ecq: [3]
    - text: >-
        Data Systems Lead on the Headquarters Mission Management Team for 11
        satellite missions and airborne campaigns, with oversight of each
        mission's Open Science and Data Management Plan; portfolio defaults
        to open-source software and open data.
      priority: 2
      tags: [open-science, policy, data-systems]
      ecq: [1, 3]
    - text: >-
        Led a FIRMS enhancement through a partnership with Google.org while
        keeping continuity on a colleague's high-visibility work.
      priority: 2
      tags: [partnerships, private-sector, fire]
      ecq: [5]
    - text: >-
        Scoping a joint NASA-NOAA approach to Level-0 data reprocessing to
        cut duplicate interagency spending.
      priority: 2
      tags: [efficiency, interagency]
      ecq: [2]
    - text: >-
        Reimagined ESDS working group governance in line with Earth Science
        to Action strategy and agency guidance; charter updates for the
        ESDSWG, DAAC, and LANCE user working groups were widely adopted.
      priority: 2
      tags: [governance, policy]
      ecq: [1, 3]
    - text: >-
        Headquarters award oversight for the ESIP cooperative agreement
        (deliverables, spend plans, compliance with award terms); started
        the first regular NASA-NOAA-USGS coordination meeting of ESIP agency
        representatives.
      priority: 2
      tags: [grants, interagency, governance]
      ecq: [1, 2]
    - text: >-
        Served on the Association of Fish and Wildlife Agencies Data and
        Technology Committee; brought the State of Missouri onto the LP DAAC
        User Working Group.
      priority: 2
      tags: [states, conservation, partnerships]
      ecq: [5]
    - text: >-
        Primary ESDS Headquarters point of contact for Earth Action; supported
        the Earth Action private sector engagement project (survey, strategy,
        execution) and integrated ARSET training materials into Earthdata.gov.
      priority: 3
      tags: [partnerships, private-sector, outreach]
    - text: >-
        Presented to the LANCE User Working Group in a question-driven format
        that ESDIS leadership adopted for SIPS and DAAC meetings; ESDIS
        assigned a dedicated LANCE engineer for the first time.
      priority: 3
      tags: [governance, leadership]
      ecq: [4]
    - text: >-
        Synthesized usage and impact information to inform the AMSR-2 science
        data cessation decision.
      priority: 3
      tags: [metrics, data-systems]
      ecq: [3]
    - text: >-
        Served on the inaugural Satellite Needs Working Group (SNWG) Science
        and Applications Board (Cycle 24).
      priority: 3
      tags: [interagency]
    - text: >-
        Connected the Congressional Research Service natural resources team
        with NASA's Earth Information Center through a high-level engagement
        and tour.
      priority: 3
      tags: [policy, outreach]
    - text: >-
        Connected a National Park Service detailee (SES Candidate Development
        Program project) to multiple Headquarters and center programs.
      priority: 3
      tags: [interagency, mentoring]
    - text: >-
        Co-conceived and implemented the multi-center Biodiversity and
        Ecological Conservation Virtual Center, which has since evolved into
        a community of practice.
      priority: 3
      tags: [leadership, partnerships]
    - text: >-
        Ran the ESDS FINESST review panel (voluntary).
      priority: 3
      tags: [grants]

- id: nasa-ecocon
